services:
  app:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-collablearn}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
      - DB_NAME=${DB_NAME:-collablearn}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-collablearn}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
      - POSTGRES_DB=${DB_NAME:-collablearn}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
