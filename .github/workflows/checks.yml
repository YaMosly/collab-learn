name: Checks

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: collablearn
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: collablearn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U collablearn -d collablearn_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COLLABLEARN_TEST_DATABASE_URL: postgres://collablearn:test-only@127.0.0.1:5432/collablearn_test?sslmode=disable
      COLLABLEARN_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Client tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check web/static/js/app.js
          node --check web/static/js/document-sync.js
      - name: Go vet
        run: go vet ./...
      - name: Go tests, race detector, and native integrations
        run: go test -race -v ./...
